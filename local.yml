---
# ============================================================================
#  Project 2 — your hardening playbook.   (ansible-pull runs THIS file)
#
#  ansible-pull looks for a file named local.yml at the root of your git repo,
#  and runs it ON the box itself (no SSH, no inventory needed).
#
#  To apply it on your box:
#     sudo ansible-pull -U https://github.com/zachjf9/ansible-pull-project.git
#
#  Goal: bring a broken box into the hardened target state (see the portal for
#  the 14 tasks and exactly what each one checks). Your playbook must be
#  IDEMPOTENT — running it a second time should report changed=0.
# ============================================================================

- name: Project 2 hardening
  hosts: localhost
  connection: local
  become: true

  tasks:

    # ----- EXAMPLE (safe to keep) — shows the shape of a task -------------
    - name: Example — make sure a package is present
      ansible.builtin.package:
        name: ca-certificates
        state: present
    # ---------------------------------------------------------------------

    # Install packages
    
    - name: Install packages
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
          - python3-pymysql
        state: present
        update_cache: true
        cache_valid_time: 3600

    # ======================= Domain A — System / SSH =====================

    # SSH

    - name: Disable root SSH login and password authentication
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-course.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
        owner: root
        group: root
        mode: '0644'
      notify: Restart SSH

    # Firewall

    - name: Deny incoming
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Allow outgoing
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow SSH through firewall
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Enable firewall
      community.general.ufw:
        state: enabled

    # Unauthorized scheduled job

    - name: Remove unauthorized scheduled job
      ansible.builtin.file:
        path: /etc/cron.d/sysstat-collect
        state: absent

    # Disable unnecessary services

    - name: Check for rogue service
      ansible.builtin.stat:
        path: /etc/systemd/system/debugshell.service
      register: rogue_service

    - name: Disable rogue service
      ansible.builtin.systemd_service:
        name: debugshell.service
        state: stopped
        enabled: false
      when: rogue_service.stat.exists

    - name: Remove rogue service file
      ansible.builtin.file:
        path: /etc/systemd/system/debugshell.service
        state: absent
      notify: Reload systemd

    - name: Remove rogue service directory
      ansible.builtin.file:
        path: /etc/systemd/system/debugshell.service.d
        state: absent
      notify: Reload systemd

    # fail2ban

    - name: fail2ban installation and configuration
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        content: |
          [sshd]
          enabled = true
          port = ssh
          backend = systemd
          maxretry = 5
          findtime = 10m
          bantime = 1h
        owner: root
        group: root
        mode: '0644'
      notify: Restart fail2ban

    - name: Enable fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    # World-writable application directory

    - name: Fix the world-writable application directory
      ansible.builtin.file:
        path: /srv/data/incoming
        state: directory
        owner: root
        group: root
        mode: '0755'

    # ================= Domain B — Users / privilege escalation ===========

    # Remove the unauthorized sudo account

    - name: Remove unauthorized sudo account
      ansible.builtin.user:
        name: monitor
        groups: ''
        append: false

    # Update password rules

    - name: Remove the passwordless-sudo (NOPASSWD) rule
      ansible.builtin.file:
        path: /etc/sudoers.d/90-course-nopasswd
        state: absent

    - name: Require password for sudo
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/90-cloud-init-users
        regexp: '^\s*ubuntu\s+ALL=\(ALL\)\s+NOPASSWD:'
        line: 'ubuntu ALL=(ALL) ALL'
        validate: '/usr/sbin/visudo -cf %s'

    # Remove the SUID-root binary

    - name: Remove the unexpected SUID-root binary
      ansible.builtin.file:
        path: /usr/local/bin/flushcache
        state: absent

    # Fix the account that has a blank password

    - name: Fix the account that has a blank password
      ansible.builtin.user:
        name: kioskuser
        password: '!'
        password_lock: true
        update_password: always

    # Restrict the world-readable credentials file

    - name: Restrict the world-readable credentials file
      ansible.builtin.file:
        path: /opt/crm/.env
        owner: root
        group: root
        mode: '0600'

    # ================== Domain C — Database least-privilege ==============

    # These need the community.mysql collection + pymysql. Install once:
    #     ansible-galaxy collection install community.mysql
    #     sudo apt-get install -y python3-pymysql

    # Restrict database privileges

    - name: Restrict webapp DB privileges
      community.mysql.mysql_user:
        name: webapp
        host: '%'
        priv: 'ticketdb.*:SELECT,INSERT,UPDATE,DELETE'
        append_privs: false
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Restrict DB privileges
      community.mysql.mysql_user:
        name: reporting
        host: '%'
        priv: 'ticketdb.*:SELECT'
        append_privs: false
        login_unix_socket: /var/run/mysqld/mysqld.sock

    # Tighten DB access hosts; drop anonymous/stale accounts

    - name: Remove DB root account
      community.mysql.mysql_user:
        name: root
        host: '%'
        state: absent
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Remove anonymous/stale DB account
      community.mysql.mysql_user:
        name: ''
        host: '%'
        state: absent
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Remove anonymous DB account on localhost
      community.mysql.mysql_user:
        name: ''
        host: localhost
        state: absent
        login_unix_socket: /var/run/mysqld/mysqld.sock

  handlers:

    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
